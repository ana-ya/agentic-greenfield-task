# CodeRabbit — code review for Weather Explorer.
# Advisory only (does not block merging). Reviews the code and specs, not the PR description.
language: "uk-UA"
tone_instructions: "Досвідчений рев'юер. Українською, дружньо, конкретно. Рев'ю коду та специфікацій по суті."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    # The PR description is free-form; don't check it against a template.
    description:
      mode: "off"
  path_instructions:
    - path: "**"
      instructions: >-
        Рев'юй код і специфікації по суті: очевидні баги, розбіжності з вимогами
        в openspec/ та docs/requirements.md, безпека секретів, ясність. Без причіпок
        до стилю, який і так ловить лінтер. Не вимагай у описі PR імені автора,
        відео-демо чи опису практик — опис PR довільний.
