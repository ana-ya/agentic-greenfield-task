<!-- @dsCard group="Forecast" height=260 -->
<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>DayCard — preview</title></head>
<body>
<div class="wx-days" id="root" style="grid-template-columns:repeat(4,minmax(140px,1fr))">
  <article class="wx-day" tabindex="0">
    <span class="wx-day-name">Чт, 26 лист.</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-label="Хмарно"><path d="M7 19h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2A3.5 3.5 0 0 0 7 19z"/></svg>
    <span class="wx-hilo">11° <span>/ 4°</span></span>
    <span class="wx-figs"><span>Опади 20%</span><span>Вітер 14 км/год</span></span>
    <span data-score="64"></span>
  </article>
  <article class="wx-day" tabindex="0">
    <span class="wx-day-name">Пт, 27 лист.</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Дощ"><path d="M7 15h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2A3.5 3.5 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>
    <span class="wx-hilo">9° <span>/ 3°</span></span>
    <span class="wx-figs"><span>Опади 80%</span><span>Вітер 22 км/год</span></span>
    <span data-score="31"></span>
  </article>
  <article class="wx-day wx-day-weekend" tabindex="0">
    <span class="wx-day-name">Сб, 28 лист.</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-label="Ясно"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="wx-hilo">13° <span>/ 5°</span></span>
    <span class="wx-figs"><span>Опади 5%</span><span>Вітер 8 км/год</span></span>
    <span data-score="84"></span>
  </article>
  <article class="wx-day wx-day-weekend" tabindex="0">
    <span class="wx-day-name">Нд, 29 лист.</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Мінлива хмарність"><path d="M8 4v1.5M3.5 8H2M4.8 4.8l1 1"/><path d="M5.3 11.2A3.5 3.5 0 0 1 11 6.5"/><path d="M8 20h9a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 8 20z"/></svg>
    <span class="wx-hilo">12° <span>/ 6°</span></span>
    <span class="wx-figs"><span>Опади 15%</span><span>Вітер 11 км/год</span></span>
    <span data-score="72"></span>
  </article>
</div>
<script>
var W = window.WeatherExplorer;
document.querySelectorAll('[data-score]').forEach(function (el) {
  var s = +el.getAttribute('data-score');
  el.outerHTML = W && W.badgeHTML ? W.badgeHTML(s) : '<span class="wx-badge">' + s + '</span>';
});
</script>
</body>
</html>
