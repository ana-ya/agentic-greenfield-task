# NFR-DX-02: every pull request and every push to main is checked on a clean runner
# with the same command developers run locally (`npm run verify`).
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Node version
        run: node -v

      # Fails when package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Its own step, so the log shows the duration measured against the 60 s budget (NFR-DX-01).
      - name: npm run verify
        run: npm run verify
